events {
    worker_connections 1024;
}

http {
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }
    upstream website  { server website:3002; }
    upstream rasa     { server rasa:5005; }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    server {
        listen 8080;
        location / {
            proxy_pass http://website;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name localhost;

        location = /chat { return 301 /chat/; }

        location /chat/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Static files của website — browser request /_next/ không có prefix /chat/
        location /_next/ {
            proxy_pass http://127.0.0.1:8080/_next/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            if ($request_method = 'OPTIONS') { return 204; }
        }

        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /rasa/ {
            rewrite ^/rasa/(.*) /$1 break;
            proxy_pass http://rasa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        }

        location /socket.io/ {
            proxy_pass http://rasa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}